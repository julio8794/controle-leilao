<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Leilão</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c232d;--line:#2a3340;--txt:#e6edf3;--mut:#8b98a8;
  --acc:#f5a524;--good:#3fb950;--bad:#f85149;
  --c-arremate:#4c8dff;--c-estetica:#d16bff;--c-documentacao:#f5a524;--c-mecanica:#2bc4b4;--c-transporte:#8b98a8;--c-outros:#ff7a59;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
.num,.kpi b,h1{font-family:"Space Grotesk",Inter,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px;flex:1;min-width:200px}
h1 .logo{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#111;font-size:17px}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{background:none;border:0;padding:7px 14px;border-radius:8px;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--panel2);color:var(--txt)}
.savest{font-size:12px;color:var(--mut);width:100%;}
main{max-width:1100px;margin:auto;padding:16px 16px 100px}
.btn{background:var(--acc);color:#111;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:23px;margin-top:4px}
.kpi small{color:var(--mut);font-size:12px}
.sec-t{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel2)}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.legend .v{margin-left:auto;font-family:"Space Grotesk";font-size:13px}
.legend .p{color:var(--mut);font-size:12px;width:38px;text-align:right}
.vbar{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.vbar .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .track{position:relative;height:22px}
.vbar .track .stack{height:22px;border-radius:6px}
.vbar .sale{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--good);border-radius:2px}
.vbar .sale.neg{background:var(--bad)}
.vbar .lbl{font-size:11px;color:var(--mut);margin-top:2px}
.list{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.vcard{cursor:pointer;transition:border-color .15s}
.vcard:hover{border-color:var(--acc)}
.vtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vtop h3{margin:0;font-size:16px}
.vtop .sub{font-size:12px;color:var(--mut);margin-top:3px}
.chip{font-size:11px;font-weight:700;padding:4px 8px;border-radius:20px;white-space:nowrap}
.st-arrematado{background:#4c8dff22;color:#7aaaff}
.st-preparacao{background:#d16bff22;color:#e19bff}
.st-avenda{background:#f5a52422;color:#ffc35c}
.st-vendido{background:#3fb95022;color:#5fd36f}
.vnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.vnums div span{display:block;font-size:11px;color:var(--mut)}
.vnums div b{font-family:"Space Grotesk";font-size:15px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.empty .big{font-size:44px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;font:inherit}
.toolbar input{flex:1;min-width:160px}
.fab{position:fixed;right:18px;bottom:18px;z-index:6;box-shadow:0 8px 24px #0008;border-radius:30px;padding:14px 20px;font-size:15px}
/* editor */
.ov{position:fixed;inset:0;background:#000a;z-index:10;display:none;align-items:flex-start;justify-content:center;overflow:auto}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;min-height:100%;border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media(min-width:800px){.sheet{min-height:auto;margin:24px 0;border:1px solid var(--line);border-radius:18px;overflow:hidden}}
.shead{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px}
.shead .row{display:flex;align-items:center;gap:10px}
.shead h2{margin:0;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summ{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.summ div{background:var(--panel2);border-radius:10px;padding:7px 8px}
.summ span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase}
.summ b{font-family:"Space Grotesk";font-size:14px}
.sbody{padding:4px 16px 30px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:16px 0 0;background:var(--panel)}
legend{font-weight:700;padding:0 6px;display:flex;align-items:center;gap:6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.f3{grid-template-columns:1fr 1fr}.summ{grid-template-columns:1fr 1fr}}
label{display:block;font-size:12px;color:var(--mut)}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 10px;font:inherit}
label input:focus,label select:focus,label textarea:focus,.drow input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.calc{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.calc b{font-family:"Space Grotesk";font-size:16px}
.calc.big{border:1px solid var(--acc)}
.calc.big b{font-size:20px;color:var(--acc)}
.drow{display:grid;grid-template-columns:1fr 110px 34px;gap:6px;margin-top:6px}
.drow input{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 10px;font:inherit;min-width:0}
.drow button{background:none;border:1px solid var(--line);border-radius:9px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{background:var(--panel2);border:1px dashed var(--line);border-radius:20px;padding:5px 10px;font-size:12px;color:var(--mut)}
.chips button:hover{color:var(--txt);border-color:var(--acc)}
.mini{font-size:12px;color:var(--mut);margin-top:8px}
.confirm{display:none;margin-top:10px;padding:12px;border:1px solid var(--bad);border-radius:10px}
.confirm.on{display:block}
textarea.bk{width:100%;min-height:120px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px monospace}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rank:last-child{border:0}
.rank .n{width:22px;height:22px;border-radius:6px;background:var(--panel2);display:grid;place-items:center;font-size:12px;font-weight:700}
.rank .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.two{grid-template-columns:1fr}
@media(min-width:860px){.two{grid-template-columns:1.4fr 1fr}}
.st-avaliacao{background:#8b98a822;color:#b8c3d1}
.drop{display:block;border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--mut);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--txt)}
.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:12px}
.thumbs span{position:absolute;left:4px;bottom:4px;background:#000b;font-size:10px;padding:2px 5px;border-radius:5px}
.aibtn{width:100%;padding:15px;font-size:16px;margin-top:14px}
.aist{margin-top:10px;font-size:13px;color:var(--mut);white-space:pre-wrap}
.verdict{border-radius:var(--r);padding:16px;margin-top:14px;border:1px solid}
.verdict h3{margin:0 0 4px;font-size:18px}
.scn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.scn div{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.scn span{display:block;font-size:11px;color:var(--mut)}
.scn b{font-family:"Space Grotesk";font-size:17px}
.scn .main{outline:2px solid var(--acc)}
.gauge{position:relative;height:18px;border-radius:9px;overflow:hidden;display:flex;margin-top:16px}
.gwrap{position:relative;margin-bottom:22px}
.gmark{position:absolute;top:10px;width:4px;height:26px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px #000}
.gmark small{position:absolute;top:28px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:var(--txt)}
.irow{display:grid;grid-template-columns:26px 1fr 104px 30px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border:0}
.irow input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.irow .nm{font-size:14px}
.irow .ev{font-size:11px;color:var(--mut);margin-top:2px}
.irow .rg{font-size:11px;color:var(--mut)}
.irow input.v{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 8px;font:inherit;font-size:14px}
.irow button{background:none;border:0;color:var(--mut)}
.irow.off{opacity:.45}
.gv{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.gv-alta{background:var(--bad)}.gv-media{background:var(--acc)}.gv-baixa{background:var(--good)}
.ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.ul li{margin:4px 0}
.note{font-size:12px;color:var(--mut);background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:10px}
a.lk{color:var(--acc)}
.spark{width:100%;height:60px;margin-top:8px}
/* vistoria */
.pkg{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px;margin-bottom:14px;border-radius:18px;background:linear-gradient(120deg,#2a1d05 0%,#1a1406 45%,var(--panel) 100%);border:1px solid #f5a52455;box-shadow:0 10px 30px -18px #f5a524}
.pkg-thumbs{display:grid;grid-template-columns:repeat(2,34px);gap:3px}
.pkg-thumbs img{width:34px;height:34px;object-fit:cover;border-radius:8px}
.pkg-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.pkg-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700}
.pkg-txt b{font-size:15px}.pkg-txt small{color:var(--mut);font-size:12px}
@media(max-width:600px){.pkg{grid-template-columns:auto 1fr}.pkg .btn{grid-column:1/-1}}
.vcard.has-cover{padding:0;overflow:hidden}
.vcard.has-cover>*:not(.cover){margin-left:14px;margin-right:14px}
.vcard.has-cover>*:last-child{margin-bottom:14px}
.cover{position:relative;aspect-ratio:16/10;background:#000;margin-bottom:12px}
.cover>img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.vcard:hover .cover>img{transform:scale(1.04)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#0d1117e6)}
.cover-tags{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
.cover-tags span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:#0d1117cc;backdrop-filter:blur(6px);border:1px solid #ffffff22}
.cover-strip{position:absolute;right:10px;bottom:10px;display:flex;gap:5px;z-index:1}
.cover-strip img{width:38px;height:38px;object-fit:cover;border-radius:8px;border:2px solid #0d1117}
.vist-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);margin-top:12px}
.vbar2{flex:1;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.vbar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#3fb950);border-radius:3px;transition:width .3s}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -16px 0;padding:0 16px}
.gal-i{flex:0 0 72%;max-width:340px;aspect-ratio:4/3;border:0;padding:0;border-radius:14px;overflow:hidden;scroll-snap-align:start;background:#000}
.gal-i img{width:100%;height:100%;object-fit:cover;display:block}
fieldset.vist{border-color:#f5a52466;background:linear-gradient(180deg,#1f1a0e,var(--panel) 120px)}
.chk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk:last-of-type{border:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{border:0;background:none;padding:6px 8px;border-radius:8px;font-size:12px;color:var(--mut);white-space:nowrap}
.seg .s-ok.on{background:#3fb95033;color:#5fd36f}.seg .s-at.on{background:#f5a52433;color:#ffc35c}.seg .s-pb.on{background:#f8514933;color:#ff7b72}
@media(max-width:480px){.chk{flex-direction:column;align-items:stretch;gap:6px}.seg button{flex:1}}
.lb{position:fixed;inset:0;z-index:30;background:#000e;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:86vh;border-radius:10px;object-fit:contain}
.lb-x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:18px}
.lb-n{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:#ffffff1f;color:#fff;font-size:28px}
.lb-n.l{left:10px}.lb-n.r{right:10px}
#lbN{position:absolute;bottom:18px;color:#fff;font-size:13px;background:#0008;padding:4px 10px;border-radius:12px}
.ro #fab,.ro #eNew,.ro #eDemo,.ro #bkRest,.ro .chips,.ro #xDel,.ro #fAdd,.ro [data-del],.ro [data-fhdel],.ro #avSave{display:none!important}
.ro .seg button{pointer-events:none}
/* auth + equipe + fotos vistoria */
.auth{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,#f5a52433,transparent 60%),radial-gradient(900px 500px at 110% 110%,#4c8dff26,transparent 60%),var(--bg)}
.auth.on{display:flex}
.auth-box{width:100%;max-width:380px;background:#161b22e6;border:1px solid var(--line);border-radius:24px;padding:28px 22px;box-shadow:0 30px 80px -30px #000;backdrop-filter:blur(10px)}
.a-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#ffc35c,#f5a524 55%,#d9870a);display:grid;place-items:center;font-size:28px;box-shadow:0 10px 30px -10px #f5a524}
.auth h2{margin:16px 0 4px;font-family:"Space Grotesk";font-size:24px}
.a-sub{margin:0 0 18px;color:var(--mut);font-size:14px}
.a-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.a-tabs button{border:0;background:none;padding:9px;border-radius:9px;color:var(--mut);font-weight:600}
.a-tabs button.on{background:var(--panel2);color:var(--txt)}
.auth label{margin-top:10px}
.a-link{display:block;margin:14px auto 0;background:none;border:0;color:var(--acc);font-size:13px}
.a-msg{margin-top:14px;font-size:13px;line-height:1.5;padding:10px 12px;border-radius:10px;background:#3fb9501f;border:1px solid #3fb95055}
.a-msg.err{background:#f851491f;border-color:#f8514955}
#who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);width:100%}
#who button{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;color:var(--mut);padding:4px 10px;font-size:12px}
.pap{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:6px}
.pap-admin{background:#f5a52426;color:#ffc35c}.pap-editor{background:#4c8dff26;color:#7aaaff}.pap-leitor{background:#8b98a826;color:#b8c3d1}
.only-admin{display:none}.is-admin .only-admin{display:inline-block}
.eq{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.eq b{display:block;font-size:14px}.eq small{color:var(--mut);font-size:12px}
.eq select{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px;font:inherit}
.vf{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-bottom:10px}
.vf-i{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#000}
.vf-i>button:first-child{border:0;padding:0;width:100%;height:100%;background:none}
.vf-i img{width:100%;height:100%;object-fit:cover;display:block}
.vf-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:11px}
.ro .vf-x,.ro .vf-add{display:none!important}
.vf-add{display:inline-flex;align-items:center;cursor:pointer}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:20;display:none}
</style>
</head>
<body>
<header><div class="hwrap">
  <h1><span class="logo">🔨</span>Leilão de Veículos</h1>
  <div class="tabs"><button data-tab="painel" class="on">📊 Painel</button><button data-tab="veiculos">🚗 Veículos</button><button data-tab="avaliar">🤖 Avaliar</button><button data-tab="equipe" class="only-admin">👥 Equipe</button></div>
  <div id="who"></div>
  <div class="savest" id="savest">Carregando…</div>
</div></header>
<main id="main"></main>
<button class="btn fab" id="fab">＋ Novo veículo</button>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="auth" id="auth"><div class="auth-box" id="authBox"></div></div>
<div class="lb" id="lb"><button class="lb-x" aria-label="Fechar">✕</button><button class="lb-n l" data-lbn="-1" aria-label="Anterior">‹</button><img id="lbImg" alt=""><button class="lb-n r" data-lbn="1" aria-label="Próxima">›</button><span id="lbN"></span></div>

<script>
const CATS={
  arremate:{n:"Arremate",c:"var(--c-arremate)",i:"🔨"},
  estetica:{n:"Estética",c:"var(--c-estetica)",i:"✨"},
  documentacao:{n:"Documentação",c:"var(--c-documentacao)",i:"📄"},

function calc(v){
  const lance=num(v.lance), comissao=lance*num(v.comissaoPct)/100;
  const pagamento=lance+comissao+num(v.taxaPatio)+num(v.taxaAdm)+num(v.outrosArremate);
  const porCat={arremate:pagamento,estetica:0,documentacao:0,mecanica:0,transporte:0,outros:0};
  (v.despesas||[]).forEach(d=>{porCat[d.cat]=(porCat[d.cat]||0)+num(d.valor)});
  const despesas=Object.keys(porCat).filter(k=>k!=="arremate").reduce((a,k)=>a+porCat[k],0);
  const custo=pagamento+despesas;
  const vendido=v.status==="vendido"&&num(v.vendaValor)>0;
  const venda=vendido?num(v.vendaValor):num(v.vendaPretendida);
  const lucro=venda?venda-custo:0;
  const roi=custo&&venda?lucro/custo:NaN;
  const fipe=num(v.fipe);
  const dias=v.dataLeilao?Math.max(0,Math.round(((v.dataVenda&&vendido?new Date(v.dataVenda):new Date())-new Date(v.dataLeilao))/864e5)):null;
  const margem=num(v.margemAlvo||20)/100;
  return {lance,comissao,pagamento,porCat,despesas,custo,venda,vendido,lucro,roi,fipe,pctFipe:fipe?custo/fipe:NaN,dias,precoMin:custo*(1+margem),margem};
}

}

  };

  s.onclick=e=>{

function compress(file,max=1600,q=.78){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(b=>b?res(b):rej(new Error("falha ao processar")),"image/jpeg",q)};img.onerror=()=>rej(new Error("imagem inválida"));img.src=URL.createObjectURL(file)})}
async function uploadVF(files){

      const {error}=await sb.storage.from("vistorias").upload(path,blob,{contentType:"image/jpeg"});if(error)throw error;
      const url=sb.storage.from("vistorias").getPublicUrl(path).data.publicUrl;v.fotosVist=v.fotosVist||[];v.fotosVist.push({url,path,t:Date.now(),por:me&&me.id});ok++;
      if(editing===v)renderVF();persist(v);
    }catch(e){toast("Falha ao enviar foto: "+(e.message||e))}}
  if(st)st.textContent=ok?`✓ ${ok} foto(s) salva(s)`:"";
}

function fipeInfo(){
  const el=$("#fipeInfo");if(!el)return;
  const c=calc(editing);
  const h=(editing.fipeHist||[]).filter(x=>num(x.valor)>0&&x.data).sort((a,b)=>a.data<b.data?-1:1);
  let out="";
  if(h.length>=2){
    const vs=h.map(x=>num(x.valor)),mn=Math.min(...vs),mx=Math.max(...vs),rg=mx-mn||1;
    const pts=vs.map((v,i)=>`${(i/(vs.length-1)*300).toFixed(1)},${(52-(v-mn)/rg*44).toFixed(1)}`).join(" ");
    const varp=(vs[vs.length-1]-vs[0])/vs[0];
    out+=`<svg class="spark" viewBox="-4 0 308 60" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${varp>=0?"#3fb950":"#f85149"}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>
    <div class="calc"><span>Variação da FIPE (${h[0].data.split("-").reverse().join("/")} → hoje)</span><b class="${varp>=0?"pos":"neg"}">${varp>=0?"+":""}${pct(varp)}</b></div>`;
  }
  const fipe=c.fipe||(h.length?num(h[h.length-1].valor):0);
  if(fipe){
    if(num(editing.vendaPretendida))out+=`<div class="calc"><span>Venda alvo = % da FIPE</span><b>${pct(num(editing.vendaPretendida)/fipe)}</b></div>`;
    if(num(editing.vendaValor))out+=`<div class="calc"><span>Vendido por = % da FIPE</span><b>${pct(num(editing.vendaValor)/fipe)}</b></div>`;
    out+=`<div class="calc"><span>Faixa comum p/ carro de leilão (70–90% FIPE)</span><b>${brl(fipe*.7)} – ${brl(fipe*.9)}</b></div>`;
  }
  el.innerHTML=out;
}

2. Para cada item diga o que você VIU (cite a foto) ou por que é provável. Avarias que não dá para confirmar nas fotos (ex.: motor não testado, airbag, chassi) entram com servico "verificar" e custo provável.
3. Valores em reais (min e max), peças + mão de obra, oficina independente e peças de boa qualidade no estado ${av.uf||"informado"}. Seja realista e não otimista.
4. Inclua SEMPRE a documentação típica de carro de leilão. Monta média/grande: inclua vistoria/regularização especial e mencione a desvalorização.
5. Estime a FIPE do modelo/ano (pelo seu conhecimento; pode estar desatualizada) e um preço de revenda realista já considerando que carro com registro de leilão vende abaixo da FIPE.
6. Sem fotos ou com fotos ruins: confianca "baixa".

Responda SOMENTE com um JSON neste formato exato:
{"resumo":"2-3 frases sobre o estado geral","nota":7,"condicao_geral":"boa|regular|ruim|critica","confianca":"alta|media|baixa",
"itens":[{"categoria":"estetica","peca":"Para-choque dianteiro","servico":"trocar|reparar|pintar|polir|verificar","gravidade":"alta|media|baixa","min":600,"max":1100,"evidencia":"Foto 2: trincado no lado direito"}],
"fipe_estimada":{"valor":45000,"observacao":"curta"},
"preco_revenda_sugerido":{"min":36000,"max":41000,"observacao":"curta"},
"riscos":["risco curto"],"alertas_documentacao":["alerta curto"],"dicas_vistoria":["o que conferir pessoalmente"]}`;
}
const ERR={not_granted:"Você não autorizou o uso da IA neste app. Recarregue e permita para analisar.",sampling_disabled:"A IA não está disponível para esta conta.",rate_limited:"Muitas análises seguidas ou limite de uso atingido. Tente de novo em alguns minutos.",session_expired:"Entre novamente na sua conta do Claude.",image_rejected:"Alguma foto não foi aceita (formato ou tamanho). Remova e tente de novo.",images_unavailable:"Envio de fotos indisponível aqui. Remova as fotos para analisar só pela descrição.",invalid_json:"A IA respondeu fora do formato. Toque em Analisar de novo.",refused:"A IA não conseguiu analisar este conteúdo. Troque as fotos ou a descrição.",empty_completion:"A IA não retornou resposta. Tente com menos fotos.",prompt_too_large:"Descrição grande demais. Encurte o texto."};
async function runAI(){
  const s=await getSample();
  if(!s){$("#avSt").textContent="⚠ A análise com IA só funciona com o app aberto dentro do Claude (logado na sua conta).";return}
  if(!av.modelo&&!avPhotos.length&&!av.descricao){toast("Informe o modelo, a descrição ou envie fotos");return}
  const go=$("#avGo"),stop=$("#avStop"),st=$("#avSt");
  go.disabled=true;go.textContent="⏳ Analisando… (pode levar até 1–2 min)";stop.style.display="inline-block";
  st.textContent=`Enviando ${avPhotos.length} foto(s) e dados para a IA…`;
  avCtl=new AbortController();
  const t0=Date.now();const tick=setInterval(()=>{if(st.dataset.stream!=="1")st.textContent=`🔍 Examinando fotos e calculando custos… ${Math.round((Date.now()-t0)/1000)}s`},1000);
  try{
    const opts={signal:avCtl.signal,modelTier:"default",cache:false,onText:({text})=>{st.dataset.stream="1";st.textContent=`✍️ Montando o relatório… (${text.length} caracteres)`}};
    if(avPhotos.length&&sampleLim&&sampleLim.images)opts.images=avPhotos.map(p=>p.file);
    const r=await s.json(buildPrompt(),opts);
    if(!r||!Array.isArray(r.itens))throw {code:"invalid_json"};
    av.result=r;av.data=new Date().toISOString();
    av.itens=r.itens.map(i=>({...i,min:num(i.min),max:num(i.max),valor:String(Math.round((num(i.min)+num(i.max))/2)),on:true,categoria:CATS[i.categoria]?i.categoria:"outros"}));
    st.textContent=`✅ Análise concluída em ${Math.round((Date.now()-t0)/1000)}s. Ajuste os valores se quiser — tudo recalcula na hora.`;
    renderAvRes();setTimeout(()=>{const el=$("#avRes");if(el)el.scrollIntoView({behavior:"smooth"})},100);
  }catch(e){
    st.textContent=e&&e.code==="cancelled"?"Análise interrompida.":"⚠ "+(ERR[e&&e.code]||"Falha temporária na IA. Tente de novo.");
  }finally{clearInterval(tick);delete st.dataset.stream;go.disabled=false;go.textContent=av.result?"🔄 Analisar de novo":"🤖 Analisar com IA";stop.style.display="none";avCtl=null}
}
function avCalc(){
  const it=av.itens.filter(i=>i.on!==false);
  const S=f=>it.reduce((a,i)=>a+f(i),0);
  const sMin=S(i=>Math.min(num(i.min),num(i.valor))),sMax=S(i=>Math.max(num(i.max),num(i.valor))),sVal=S(i=>num(i.valor));
  const cont=num(av.conting)/100,com=num(av.comissaoPct)/100,m=num(av.margem)/100,tx=num(av.taxas);
  const r=av.result||{};const rv=r.preco_revenda_sugerido||{};
  const revMed=num(rv.min)&&num(rv.max)?(num(rv.min)+num(rv.max))/2:0;
  const fipeIA=num(r.fipe_estimada&&r.fipe_estimada.valor);
  const fipe=num(av.fipe)||fipeIA;
  const V=num(av.vendaAlvo)||revMed||fipe*.85;
  const vSrc=num(av.vendaAlvo)?"informada por você":revMed?"sugerida pela IA":fipe?"85% da FIPE":"";
  const lm=rep=>Math.max(0,(V/(1+m)-tx-rep*(1+cont))/(1+com));
  const otim=lm(sMin),real=lm(sVal),pess=lm(sMax);
  const L=num(av.lanceAtual);
  const custoL=L*(1+com)+tx+sVal*(1+cont);
  const porCat={};Object.keys(CATS).forEach(k=>porCat[k]=0);it.forEach(i=>porCat[i.categoria]+=num(i.valor));
  return {sMin,sMax,sVal,cont,com,m,tx,V,vSrc,fipe,fipeIA,otim,real,pess,L,custoL,lucroL:L?V-custoL:NaN,roiL:L?(V-custoL)/custoL:NaN,porCat,rv};
}
function avSum(){
  const el=$("#avSum");if(!el)return;const c=avCalc();
  if(!c.V){el.innerHTML=`<div class="note">Informe a FIPE ou o preço de venda alvo para calcular o lance máximo.</div>`;return}
  let vd,col;
  if(!c.L){vd=["🎯 Lance máximo calculado","Informe o lance atual para comparar."];col="var(--acc)"}
  else if(c.L<=c.pess){vd=["🟢 Ótimo negócio","Lance abaixo até do cenário pessimista."];col="var(--good)"}
  else if(c.L<=c.real){vd=["🟡 Bom, dentro do limite","Cabe no cenário realista com sua margem."];col="#e3c400"}
  else if(c.L<=c.otim){vd=["🟠 Arriscado","Só fecha a conta se os reparos saírem no mínimo."];col="#ff8c3a"}
  else{vd=["🔴 Acima do limite","Nesse lance você não atinge a margem desejada."];col="var(--bad)"}
  const top=Math.max(c.otim,c.L,1)*1.15;
  const z=(a,b,cl)=>`<i style="width:${Math.max(0,(Math.min(b,top)-a)/top*100)}%;background:${cl}"></i>`;
  // composição da venda no lance realista
  const lr=c.real,comp=[["Lance",lr,"var(--c-arremate)"],["Comissão",lr*c.com,"#7aaaff"],["Taxas",c.tx,"var(--c-transporte)"],["Reparos/docs",c.sVal,"var(--c-estetica)"],["Reserva",c.sVal*c.cont,"#6b5a8a"],["Lucro",c.V-(lr*(1+c.com)+c.tx+c.sVal*(1+c.cont)),"var(--good)"]];
  el.innerHTML=`
  <div class="verdict" style="border-color:${col};background:color-mix(in srgb,${col} 10%,transparent)">
   <h3 style="color:${col}">${vd[0]}</h3><div style="font-size:14px">${vd[1]}</div>
   <div class="scn"><div><span>Otimista</span><b>${brl(c.otim)}</b></div><div class="main"><span>Lance máx. realista</span><b>${brl(c.real)}</b></div><div><span>Pessimista</span><b>${brl(c.pess)}</b></div></div>
   <div class="gwrap"><div class="gauge">${z(0,c.pess,"#3fb95099")}${z(c.pess,c.real,"#e3c40099")}${z(c.real,c.otim,"#ff8c3a99")}${z(c.otim,top,"#f8514999")}</div>
   ${c.L?`<div class="gmark" style="left:calc(${Math.min(c.L/top,1)*100}% - 2px)"><small>seu lance ${brl(c.L)}</small></div>`:""}</div>
   ${c.L?`<div class="calc"><span>Lucro estimado nesse lance (realista)</span><b class="${c.lucroL>=0?"pos":"neg"}">${brl(c.lucroL)} · ${pct(c.roiL)}</b></div>`:""}
  </div>
  <div class="sec-t">Composição da venda alvo (${brl(c.V)} · ${c.vSrc})</div>
  <div class="card"><div class="stack" style="height:22px">${comp.map(([n,v,cl])=>v>0?`<i title="${n}" style="width:${v/c.V*100}%;background:${cl}"></i>`:"").join("")}</div>
   <div class="legend">${comp.map(([n,v,cl])=>`<div><span class="dot" style="background:${cl}"></span>${n}<span class="v">${brl(v)}</span><span class="p">${Math.round(v/c.V*100)}%</span></div>`).join("")}</div>
   <div class="mini">No lance máximo realista, o dinheiro da venda se divide assim.</div></div>
  <div class="sec-t">FIPE × venda</div>
  <div class="card">
   <div class="calc"><span>FIPE ${num(av.fipe)?"informada":"estimada pela IA ⚠"}</span><b>${c.fipe?brl(c.fipe):"—"}</b></div>
   ${c.fipeIA&&num(av.fipe)?`<div class="calc"><span>FIPE estimada pela IA</span><b>${brl(c.fipeIA)}</b></div>`:""}
   ${c.rv&&num(c.rv.min)?`<div class="calc"><span>Revenda sugerida (IA)</span><b>${brl(num(c.rv.min))} – ${brl(num(c.rv.max))}</b></div>`:""}
   ${c.fipe?`<div class="calc"><span>Venda alvo = % da FIPE</span><b>${pct(c.V/c.fipe)}</b></div><div class="calc"><span>Lance máx. realista = % da FIPE</span><b>${pct(c.real/c.fipe)}</b></div>`:""}
   ${!num(av.fipe)&&c.fipeIA?`<div class="toolbar" style="margin:10px 0 0"><button class="btn ghost sm" id="avUseFipe">Usar FIPE estimada</button><a class="lk" style="font-size:13px" href="https://veiculos.fipe.org.br/" target="_blank" rel="noopener">Confirmar no site oficial ↗</a></div>`:""}
   ${av.result&&av.result.fipe_estimada&&av.result.fipe_estimada.observacao?`<div class="mini">IA: ${esc(av.result.fipe_estimada.observacao)}</div>`:""}
  </div>
  <div class="sec-t">Custos estimados</div>
  <div class="card"><div class="scn"><div><span>Mínimo</span><b>${brl(c.sMin)}</b></div><div class="main"><span>Considerado</span><b>${brl(c.sVal)}</b></div><div><span>Máximo</span><b>${brl(c.sMax)}</b></div></div>
   <div style="margin-top:12px">${stackHTML(c.porCat,c.sVal,14)}</div>
   <div class="legend">${Object.keys(CATS).filter(k=>c.porCat[k]).map(k=>`<div><span class="dot" style="background:${CATS[k].c}"></span>${CATS[k].i} ${CATS[k].n}<span class="v">${brl(c.porCat[k])}</span></div>`).join("")}</div>
   <div class="mini">+ reserva de ${num(av.conting)}% para imprevistos: ${brl(c.sVal*c.cont)}</div></div>`;
}
function avSubs(){Object.keys(CATS).forEach(k=>{const e=$("#isub-"+k);if(e)e.textContent=brl(av.itens.filter(i=>i.categoria===k&&i.on!==false).reduce((a,i)=>a+num(i.valor),0))})}
function renderAvRes(){
  const el=$("#avRes");if(!el)return;
  const r=av.result;
  if(!r&&!av.itens.length){el.innerHTML="";return}
  const cats=["estetica","mecanica","documentacao","transporte","outros"];
  const nota=num(r&&r.nota);
  el.innerHTML=`
  ${r?`<div class="sec-t">Diagnóstico da IA ${av.data?`<span style="font-weight:500;text-transform:none">· ${new Date(av.data).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</span>`:""}</div>
  <div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
    <span class="chip" style="background:${nota>=7?"#3fb95022":nota>=5?"#f5a52422":"#f8514922"};color:${nota>=7?"#5fd36f":nota>=5?"#ffc35c":"#ff7b72"}">Nota ${nota||"—"}/10</span>
    <span class="chip st-avaliacao">Estado: ${esc(r.condicao_geral||"—")}</span><span class="chip st-avaliacao">Confiança: ${esc(r.confianca||"—")}</span></div>
   <div style="font-size:14px;line-height:1.5">${esc(r.resumo||"")}</div></div>`:""}
  <div id="avSum"></div>
  <div class="sec-t">Peças e serviços <span style="font-weight:500;text-transform:none">· desmarque ou ajuste os valores</span></div>
  ${cats.map(k=>{const its=av.itens.map((i,ix)=>({i,ix})).filter(x=>x.i.categoria===k);return `
   <div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b><span class="dot" style="display:inline-block;background:${CATS[k].c};margin-right:6px"></span>${CATS[k].i} ${CATS[k].n}</b><b class="num" id="isub-${k}"></b></div>
   ${its.map(({i,ix})=>`<div class="irow ${i.on===false?"off":""}"><input type="checkbox" data-ion="${ix}" ${i.on===false?"":"checked"}>
     <div>${i.edit?`<input class="v" data-pn="${ix}" value="${esc(i.peca)}" style="margin-bottom:3px">`:`<div class="nm"><span class="gv gv-${esc(i.gravidade)}"></span>${esc(i.peca)}${i.servico?` <span style="color:var(--mut)">· ${esc(i.servico)}</span>`:""}</div>`}
     ${num(i.min)||num(i.max)?`<div class="rg">Faixa IA: ${brl(num(i.min))} – ${brl(num(i.max))}</div>`:""}${i.evidencia?`<div class="ev">${esc(i.evidencia)}</div>`:""}</div>
     <input class="v" data-iv="${ix}" inputmode="decimal" value="${esc(fmtIn(i.valor))}" placeholder="R$"><button data-idel="${ix}" aria-label="Remover">✕</button></div>`).join("")||`<div class="mini">Nenhum item.</div>`}
   <div class="chips"><button data-iadd="${k}">＋ Adicionar item</button></div></div>`}).join("")}
  ${r?[["⚠️ Riscos",r.riscos],["📄 Alertas de documentação",r.alertas_documentacao],["🔍 Confira na vistoria presencial",r.dicas_vistoria]].filter(x=>Array.isArray(x[1])&&x[1].length).map(([t,a])=>`<div class="sec-t">${t}</div><div class="card"><ul class="ul">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join(""):""}
  <div class="note">Estimativa feita por IA a partir das fotos e da descrição: serve para comparar lotes e definir seu limite de lance, não substitui vistoria presencial. FIPE estimada pela IA pode estar desatualizada: confirme no site oficial.</div>
  <div class="toolbar" style="margin-top:14px"><button class="btn" id="avSave">💾 ${av.vid&&vehicles.find(v=>v.id===av.vid)?"Atualizar no controle":"Salvar no controle de veículos"}</button><button class="btn ghost" id="avNew">＋ Nova avaliação</button></div>`;
  avSum();avSubs();
}
function importAv(txt){
  let o;try{const s=txt.trim();o=JSON.parse(s.slice(s.indexOf("{"),s.lastIndexOf("}")+1))}catch(e){toast("Código inválido — copie o bloco inteiro");return}
  const a=o.av||o;if(!a||typeof a!=="object"){toast("Código inválido");return}
  avPhotos.forEach(p=>URL.revokeObjectURL(p.url));avPhotos=[];
  av={...newAv(),...a,vid:null};
  av.itens=(a.itens||(a.result&&a.result.itens)||[]).map(i=>({...i,categoria:CATS[i.categoria]?i.categoria:"outros",min:num(i.min),max:num(i.max),valor:String(i.valor!=null&&i.valor!==""?num(i.valor):Math.round((num(i.min)+num(i.max))/2)),on:i.on!==false}));
  if(!av.data)av.data=new Date().toISOString();
  renderBg();toast("Análise importada ✓");setTimeout(()=>{const el=$("#avRes");if(el)el.scrollIntoView({behavior:"smooth"})},150);
}
function saveAv(){
  if(!canWrite){toast("Só o dono do app pode salvar no controle");return}
  const c=avCalc();
  let v=av.vid&&vehicles.find(x=>x.id===av.vid);
  const snap={...JSON.parse(JSON.stringify(av)),lanceMax:Math.round(c.real),vid:undefined};
  const desp=av.itens.filter(i=>i.on!==false&&num(i.valor)>0).map(i=>({id:uid(),cat:i.categoria,desc:i.peca+(i.servico?` (${i.servico})`:""),valor:String(num(i.valor))}));
  if(!v){
    v={id:uid(),modelo:av.modelo,ano:av.ano,placa:av.placa||"",leiloeiro:av.leiloeiro||"",lote:av.lote||"",dataLeilao:/^\d{4}-\d{2}-\d{2}$/.test(av.dataLeilao||"")?av.dataLeilao:new Date().toISOString().slice(0,10),status:"avaliacao",fipe:av.fipe||(c.fipeIA?String(Math.round(c.fipeIA)):""),lance:av.lanceAtual||String(Math.round(c.real)),comissaoPct:num(av.comissaoPct),taxaPatio:"",taxaAdm:av.taxas,outrosArremate:"",despesas:desp,vendaPretendida:String(Math.round(c.V)),vendaValor:"",dataVenda:"",margemAlvo:num(av.margem),obs:av.result&&av.result.resumo?"IA: "+av.result.resumo:"",link:av.link,fipeHist:[],criado:Date.now()};
    vehicles.unshift(v);av.vid=v.id;toast("Salvo como 'Em avaliação' ✓");
  }else{
    Object.assign(v,{link:av.link||v.link,modelo:v.modelo||av.modelo,ano:v.ano||av.ano});
    if(v.status==="avaliacao"){Object.assign(v,{despesas:desp,lance:av.lanceAtual||String(Math.round(c.real)),comissaoPct:num(av.comissaoPct),taxaAdm:av.taxas,taxaPatio:"",outrosArremate:"",vendaPretendida:String(Math.round(c.V)),margemAlvo:num(av.margem),fipe:av.fipe||v.fipe})}
    toast(v.status==="avaliacao"?"Avaliação atualizada ✓":"Avaliação anexada ao veículo ✓ (despesas lançadas foram mantidas)");
  }
  v.avaliacao=snap;persist(v);renderAvRes();
}
